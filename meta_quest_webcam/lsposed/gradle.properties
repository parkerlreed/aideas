android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
# Pure-Java module: AGP 9's built-in Kotlin otherwise drags in kotlin-stdlib (~2.4 MB of dex).
kotlin.stdlib.default.dependency=false
# No need for D8 to package android.* stubs; this dex is injected into system_server,
# which always has the real framework classes.
android.enableApiModelingAndGlobalSynthetics=false
